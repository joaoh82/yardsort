# The Yardsort server's local development environment: PostgreSQL, and a throwaway ZITADEL to sign
# in with. The server itself runs on the host (`just server-run`), so it rebuilds in seconds.
#
#   just server-up      start this, and set ZITADEL up for the server
#   just server-run     run the server against it
#   just server-sign-in sign a pretend device in, in a browser
#   just server-down    stop it; `just server-reset` also forgets everything in it
#
# Every password, key and secret below is a well-known value for this machine only. Everything is
# published on 127.0.0.1 alone. Never reuse any of it, or this file, anywhere reachable.
#
# ZITADEL's layout follows its own Compose example (Apache-2.0), with Caddy in front instead of
# Traefik, so nothing needs the Docker socket. It is served at http://127.0.0.1:8080, an address
# rather than `localhost` because the server accepts plain HTTP only from a loopback address.

name: yardsort-server-dev

services:
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/yardsort.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yardsort"]
      interval: 2s
      timeout: 5s
      retries: 30

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:v4.19.5
    restart: unless-stopped
    user: "0"
    command: start-from-init --masterkey "LocalDevelopmentOnlyMasterKey!32"
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: 127.0.0.1
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/zitadel?sslmode=disable

      ZITADEL_FIRSTINSTANCE_INSTANCENAME: Yardsort development
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Yardsort development
      # The person to sign in as.
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: developer@yardsort.test
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: developer@yardsort.test
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: Yardsort-dev-1
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      # A service account whose token `scripts/server-dev.mjs` uses to create the server's
      # application.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: setup
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Development setup
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/setup.pat
      # The login container's own account.
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Login client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"

      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://127.0.0.1:8080/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://127.0.0.1:8080/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://127.0.0.1:8080/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: http://127.0.0.1:8080/ui/v2/login/login?samlRequest=
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 20s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap
    depends_on:
      postgres:
        condition: service_healthy

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.19.5
    restart: unless-stopped
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      ZITADEL_SESSION_COOKIE_SECRET: LocalDevelopmentOnlySessionCookieSecret
      CUSTOM_REQUEST_HEADERS: Host:127.0.0.1:8080,X-Forwarded-Proto:http
    healthcheck:
      test:
        [
          "CMD",
          "/bin/sh",
          "-c",
          "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy",
        ]
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 20s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    depends_on:
      zitadel-api:
        condition: service_healthy

  proxy:
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy

volumes:
  postgres:
  zitadel-bootstrap:
