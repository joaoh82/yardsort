# Production's identity provider: ZITADEL, unmodified, at auth.yardsort.sh (docs/design/28 §1, §5).
# One Machine, three containers (machine_config.json): ZITADEL's API, its login pages, and Caddy
# in front routing between them. Its database is `zitadel` in production's Neon project.
#
# Deployed by hand, from the repository's root:
#   fly deploy --config crates/server/fly/auth/fly.toml --ha=false
#
# Secrets (fly secrets list -a yardsort-auth): ZITADEL_DATABASE_POSTGRES_DSN, ZITADEL_MASTERKEY,
# ZITADEL_SESSION_COOKIE_SECRET, ZITADEL_SERVICE_USER_TOKEN (the login client's), and the first
# admin's ZITADEL_FIRSTINSTANCE_ORG_HUMAN_{USERNAME,EMAIL_ADDRESS,PASSWORD}.

app = "yardsort-auth"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "30s"
machine_config = "machine_config.json"
container = "caddy"

[build]
  image = "caddy:2.11.2-alpine"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/debug/ready"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
