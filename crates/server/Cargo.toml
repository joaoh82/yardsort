[package]
name = "yardsort-server"
description = "The Yardsort server's control service: signing in through an OIDC identity provider, accounts, and the credentials the server issues to devices. A library; nothing listens yet."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
remote-proto = { path = "../remote-proto" }
base64 = "0.22"
getrandom = "0.3"
# Checks the identity provider's ID tokens. The algorithm is pinned to each key's own type, so a
# token cannot choose how it is checked. Pure-Rust crypto: no C toolchain on any platform.
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
# To the identity provider only: discovery, its keys, and the code exchange.
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# A stand-in identity provider, served over real HTTP, for the tests.
axum = "0.8"
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
