# Built into Yardsort. To change it, duplicate it: a file in your workflows folder with the same
# id is used instead of this one, and removing that file brings this one back.
# The pull request is opened by the implement step, so no text here uses `pr.*`: the steps
# after implement find the pull request from `{{ workspace.branch }}` instead. `run_test` takes
# a fixed test id or an input, so the evaluate step always leaves a test with the id
# `factory-smoke` for verify to run.
id: software-factory
name: Software factory
description: >
  Take one task from a brief you clarify, through context, a plan you approve, implementation,
  a smoke test, and a review, and stop when you say it is ready to release. It does not merge,
  deploy, or roll back.
version: 1

trigger:
  kind: manual
  context: workspace

inputs:
  - id: task
    kind: text
    label: What to build
    required: true
  - id: agent
    kind: harness
    label: Who does the work
    required: true
  - id: reviewer
    kind: harness
    label: Who reviews the code
    required: true

steps:
  - id: define
    action: start_session
    harness: "{{ inputs.agent }}"
    prompt: |
      Define the outcome of this work in {{ workspace.name }}, on branch
      `{{ workspace.branch }}`. Do not edit the repository.

      The task:

      {{ inputs.task }}

      The workspace was started with:

      {{ workspace.task }}

      Ask what you still need, with `ys workflow ask`, one `--question` per question.
      Cover anything not already settled: the problem, the behaviour they want, the
      constraints, and how they will know it is done.

      When you have enough, record the brief with `ys workflow summary --text`. The
      text must have these four parts, in this order, each with a heading: Problem,
      Desired behaviour, Constraints, Acceptance criteria. Then stop.

  - id: brief
    needs: [define]
    action: wait_session
    session: "{{ steps.define.session }}"
    until: settled
    clarify: true
    max_rounds: 5
    timeout: 24h
    produces:
      - name: brief
        from: brief

  - id: gather
    needs: [brief]
    action: start_session
    harness: "{{ inputs.agent }}"
    consumes: [brief]
    prompt: |
      Gather context for this task. You are in the worktree of `{{ workspace.branch }}`.
      Read the code and the docs that bear on it. Do not change product code, and do not
      commit.

      The task:

      {{ inputs.task }}

      Delete `factory/context.md` if it is already there, then write what you found to
      `factory/context.md`: the parts of the tree that matter, the conventions to follow,
      constraints already in the project, and the risks. Then stop. This step fails if that
      file is missing.

  - id: context
    needs: [gather]
    action: wait_session
    session: "{{ steps.gather.session }}"
    until: settled
    timeout: 2h
    produces:
      - name: context
        path: factory/context.md

  - id: plan
    needs: [context]
    action: start_session
    harness: "{{ inputs.agent }}"
    consumes: [brief, context, changes-approve-plan]
    prompt: |
      Write a plan for this task. You are in the worktree of `{{ workspace.branch }}`.
      Do not implement it, and do not commit.

      The task:

      {{ inputs.task }}

      The brief and the context are attached. If a note named `changes-approve-plan` is
      attached, the previous plan was sent back: revise the plan to answer that note.

      Delete `factory/plan.md` if it is already there, then write the plan to
      `factory/plan.md`: the approach, the files to change, how to test it, and what is out
      of scope. Then stop. This step fails if that file is missing.

  - id: plan-ready
    needs: [plan]
    action: wait_session
    session: "{{ steps.plan.session }}"
    until: settled
    timeout: 2h
    produces:
      - name: plan
        path: factory/plan.md

  - id: approve-plan
    needs: [plan-ready]
    action: approve
    consumes: [plan]
    prompt: |
      Read the plan. Approve it to start implementation. Request changes to send your
      note back to planning. Reject to stop the run.
    on:
      approved: implement
      changes_requested: plan
      rejected: stop
    max_attempts: 3

  - id: implement
    needs: [approve-plan]
    action: start_session
    harness: "{{ inputs.agent }}"
    consumes: [plan, failure-verify, changes-accept-review]
    prompt: |
      Implement the approved plan in this worktree, on `{{ workspace.branch }}`.

      The task:

      {{ inputs.task }}

      The plan is attached. If a note named `failure-verify` is attached, the smoke test
      failed: fix that. If a note named `changes-accept-review` is attached, review asked
      for changes: do those. Leave `factory/` uncommitted; those notes are for this run.

      Commit the work and push it to `{{ workspace.branch }}`. If that branch has no open
      pull request, open one with `gh pr create --draft`. If it already has one, update
      that pull request so it contains this work. Do not open a second one. Then stop.

  - id: implement-ready
    needs: [implement]
    action: wait_session
    session: "{{ steps.implement.session }}"
    until: settled
    timeout: 4h

  - id: evaluate
    needs: [implement-ready]
    action: start_session
    harness: "{{ inputs.agent }}"
    consumes: [plan]
    prompt: |
      Decide whether this change needs a smoke test, and make sure one is ready for the
      next step to run. You are in the worktree of `{{ workspace.branch }}`. Do not change
      product code, and do not commit.

      The task:

      {{ inputs.task }}

      The approved plan is attached. Read the diff against `{{ workspace.base_branch }}`
      and the workspace's existing smoke tests. A smoke test is needed when the change
      affects behaviour a person would notice by running the app: a flow, a screen, a
      command, an endpoint.

      The next step always runs the Yardsort smoke test with the id `factory-smoke`. Use
      Yardsort's `ys` command (see `ys --help`) to create it, or to update it if it is
      already there:
      - If a smoke test is needed, make `factory-smoke` exercise the changed behaviour
        and check the acceptance criteria in the plan.
      - If it is not needed, make `factory-smoke` the smallest test that checks the
        project still builds and starts.

      Delete `factory/smoke-test.md` if it is already there, then write to
      `factory/smoke-test.md` whether a smoke test is needed, why, and what
      `factory-smoke` now checks. Then stop. This step fails if that file is missing.

  - id: evaluate-ready
    needs: [evaluate]
    action: wait_session
    session: "{{ steps.evaluate.session }}"
    until: settled
    timeout: 2h
    produces:
      - name: smoke-test
        path: factory/smoke-test.md

  - id: verify
    needs: [evaluate-ready]
    action: run_test
    test: factory-smoke
    gate: true
    timeout: 30m
    on:
      passed: code-review
      failed: implement
    max_attempts: 3

  - id: code-review
    needs: [verify]
    action: start_session
    harness: "{{ inputs.reviewer }}"
    consumes: [plan]
    prompt: |
      Review the open pull request for the branch `{{ workspace.branch }}`, based on
      `{{ workspace.base_branch }}`. You are in its worktree. Another agent opened it earlier
      in this run, following the approved plan, which is attached. Find it with
      `gh pr view {{ workspace.branch }}`, which shows its number and URL; if the branch has
      no open pull request, say so and stop. The task:

      {{ inputs.task }}

      Read the whole diff against `{{ workspace.base_branch }}` and run the project's checks.
      Do not edit, commit or push anything, and do not touch `factory/`.

      When you are done, post your review on that pull request with `gh pr review
      <number>`: approve, comment or request changes. Put each finding that is
      about particular lines on those lines. Say what is wrong, why, and how you know. GitHub
      does not let the author of a pull request approve it or request changes on it; if you are
      posting as its author, post the same review with `--comment`. Then stop.

  - id: code-review-done
    needs: [code-review]
    action: wait_session
    session: "{{ steps.code-review.session }}"
    until: settled
    timeout: 2h

  - id: accept-review
    needs: [code-review-done]
    action: approve
    consumes: [plan]
    prompt: |
      The reviewer has posted its review on the pull request for `{{ workspace.branch }}`:
      `gh pr view {{ workspace.branch }} --web` opens it. Read it. Approve to go on to the
      release check. Request changes to send your note back to implementation. Reject to stop
      the run. This does not read GitHub's own approve or request-changes state.
    on:
      approved: release
      changes_requested: implement
      rejected: stop
    max_attempts: 3

  - id: release
    needs: [accept-review]
    action: approve
    consumes: [plan]
    prompt: |
      The work is ready to release. Approve to finish this run. Reject, or request
      changes, to stop it. This does not merge, deploy, or roll back.

  - id: result
    needs: [release]
    action: report
    consumes: [brief]
    title: "{{ workspace.name }} is ready to release"
    body: |
      ## Pull requests

      {{ run.pull_requests }}

      The smoke test passed and the review was accepted. Merging and deploying are still
      yours to do. What was agreed at the start follows.

  - id: ready
    needs: [result]
    action: notify
    title: "{{ workspace.name }} is ready to release"
    body: >
      The pull request for `{{ workspace.branch }}` passed the smoke test and the review
      gate. Merging and deploying are still yours to do.
