[package]
name = "yardsort-host"
description = "Yardsort's host for a computer with no screen: keeps the terminals' records, links them to a Yardsort server, and lets the operator approve devices"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "yardsort-host"
path = "src/main.rs"

# No Tauri and no WebKit: this is what runs where there is no display at all.
[dependencies]
yardsort-core = { path = "../core" }
pty-host = { path = "../pty-host", features = ["specta"] }
pty-ipc = { path = "../pty-ipc" }
remote-client = { path = "../remote-client" }
remote-host = { path = "../remote-host" }
remote-proto = { path = "../remote-proto" }

[target.'cfg(unix)'.dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
# For tests/packaging.rs, which runs on Windows too.
serde_json = "1"
tempfile = "3"
