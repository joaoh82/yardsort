# yardsort-host in a container: Yardsort on this computer, for your phone to reach. An example to
# copy and change; docs/guide/headless-host.md, "In a container", walks through it.
#
#   HOST_UID="$(id -u)" HOST_GID="$(id -g)" docker compose build
#   docker compose run --rm host sign-in https://remote.example.com --name "Build box"
#   docker compose up -d
#   docker compose exec host yardsort-host pair
#   docker compose exec host ys project add /repos/my-service
#
# The image has no agent in it. Build your own `FROM yardsort-host` that installs the ones you use,
# point `image:` at it, and mount their sign-ins into /home/yardsort.

name: yardsort-host

services:
  host:
    build:
      context: ../..
      dockerfile: crates/host/Dockerfile
      args:
        # The repositories' owner, so what the agents write is yours.
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: yardsort-host
    restart: unless-stopped
    # Nothing to publish: the host only reaches out to the server. And never the Docker socket.
    volumes:
      - data:/data
      - credentials:/credentials
      - worktrees:/worktrees
      # Your repositories, at the path you add them by.
      - ${REPOS:-./repos}:/repos
    # Stopping it ends the agents: the terminal daemon lives in the container. Give `serve` time to
    # close its link first.
    stop_grace_period: 30s

volumes:
  data:
  credentials:
  worktrees:
