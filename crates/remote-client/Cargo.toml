[package]
name = "remote-client"
description = "A device's side of the Yardsort server's HTTP API and relay: signing in through the system browser, refreshing, devices, hosts, pairing and relay sockets. Used by the app as a host, and by tools that stand in for a phone."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Apart from `yardsort-core` on purpose: the core is also `ys`, which never talks to a server,
# and a headless host (R5) will use this without the app.
[dependencies]
remote-proto = { path = "../remote-proto" }
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# The relay's WebSocket, over the same rustls, checking certificates as reqwest does.
rustls-platform-verifier = "0.7"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "sync", "time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
