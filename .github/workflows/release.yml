name: Release

# Pushing a version tag (v0.2.0, v0.2.0-beta.1) builds installers for every platform and publishes
# them as a GitHub release. The release stays a draft while the builds upload and goes public only
# if every platform succeeded, so nobody ever sees a half-filled one. See docs/releasing.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.2.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: The tag must match the version in the code
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in src-tauri/tauri.conf.json. Use 'just release <version>'."
            exit 1
          fi

      - name: Create the draft (or reuse it)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "Yardsort $TAG" $prerelease
          fi
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            args: ""
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - run: bun install --frozen-lockfile

      # Signing is optional: without the secrets the macOS build is simply unsigned. The
      # variables must be *absent* in that case — Tauri treats an empty one as a broken setup.
      - name: Enable macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No Apple certificate configured: this macOS build is unsigned. See docs/releasing.md."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set, but APPLE_CERTIFICATE is. All six are needed; see docs/releasing.md."
              exit 1
            fi
            {
              echo "$name<<__YARDSORT_EOF__"
              echo "$value"
              echo "__YARDSORT_EOF__"
            } >> "$GITHUB_ENV"
          done

      # `ys`, the command-line client. A separate binary because the app's has no console on
      # Windows, and because a CLI has no business carrying a webview. It is built first because
      # every bundle carries it next to the app (`tauri.bundle.conf.json` names it as a sidecar):
      # the packages put it on PATH or the app offers to, and it updates with the app. See
      # `src-tauri/src/ys.rs`.
      #
      # Inside the macOS app it is signed and notarized with the bundle. The loose copy attached
      # below is not: a bare executable cannot have a notarization ticket stapled to it, so a
      # quarantined download is refused whether it is signed or not. `docs/guide/cli.md` tells
      # people how to clear the flag.
      - name: Build the ys CLI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # One binary for both architectures, as the app bundle is.
            bun scripts/sidecar.mjs --universal
            cp src-tauri/binaries/ys-universal-apple-darwin ys
          elif [ "$RUNNER_OS" = "Windows" ]; then
            bun scripts/sidecar.mjs
            cp src-tauri/binaries/ys-x86_64-pc-windows-msvc.exe ys.exe
          else
            bun scripts/sidecar.mjs
            cp src-tauri/binaries/ys-x86_64-unknown-linux-gnu ys
          fi

      # `tauri.release.conf.json` switches on updater artifacts: each self-updating bundle is signed
      # with the update key, and a `latest.json` describing them is attached to the release — that
      # is what installed copies read to find out about this version. See docs/releasing.md.
      - name: Build, sign and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          tauriScript: bun tauri
          args: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.bundle.conf.json ${{ matrix.args }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Attach the ys CLI to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          case "$RUNNER_OS" in
            Linux)   name="ys-$version-linux-x86_64.tar.gz";   tar -czf "$name" ys ;;
            macOS)   name="ys-$version-macos-universal.tar.gz"; tar -czf "$name" ys ;;
            Windows) name="ys-$version-windows-x86_64.zip";     7z a "$name" ys.exe ;;
          esac
          gh release upload "$TAG" "$name" --clobber
          echo "attached $name"

  publish:
    name: Publish release
    needs: [draft, build]
    runs-on: ubuntu-24.04
    steps:
      # An installed copy that finds no `latest.json` cannot update, silently. Refuse to publish
      # a release that would strand them.
      - name: The release must carry the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" --pattern latest.json --output latest.json
          for platform in linux-x86_64 darwin-aarch64 darwin-x86_64 windows-x86_64; do
            jq -e --arg p "$platform" '.platforms | to_entries | any(.key | startswith($p)) ' latest.json >/dev/null \
              || { echo "::error::latest.json has no entry for $platform"; jq '.platforms | keys' latest.json; exit 1; }
          done
          jq '{version, platforms: (.platforms | keys)}' latest.json

      - name: Every platform built — make the release public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json url,assets -q '.url, (.assets[] | "  " + .name)'

  # Tell the package managers (AUR, Homebrew, winget). Its own workflow, so that it can also be
  # run by hand for a release that already exists, without rebuilding anything.
  packages:
    name: Package managers
    needs: publish
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
