name: Release

# Pushing a version tag (v0.2.0, v0.2.0-beta.1) builds installers for every platform and publishes
# them as a GitHub release. The release stays a draft while the builds upload and goes public only
# if every platform succeeded, so nobody ever sees a half-filled one. See docs/releasing.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.2.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: The tag must match the version in the code
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in src-tauri/tauri.conf.json. Use 'just release <version>'."
            exit 1
          fi

      - name: Create the draft (or reuse it)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "Yardsort $TAG" $prerelease
          fi
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            args: ""
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    # About twice the slowest build, the Linux one at 39 minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # A hung mirror once held a pull request's check for three hours; this takes two minutes.
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - run: bun install --frozen-lockfile

      # Signing is optional: without the secrets the macOS build is simply unsigned. The
      # variables must be *absent* in that case — Tauri treats an empty one as a broken setup.
      - name: Enable macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No Apple certificate configured: this macOS build is unsigned. See docs/releasing.md."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set, but APPLE_CERTIFICATE is. All six are needed; see docs/releasing.md."
              exit 1
            fi
            {
              echo "$name<<__YARDSORT_EOF__"
              echo "$value"
              echo "__YARDSORT_EOF__"
            } >> "$GITHUB_ENV"
          done

      # On Linux the binaries keep their symbol tables, so a crash's backtrace — `coredumpctl
      # info`, or gdb on the core — names the functions it went through, where a stripped one
      # shows bare addresses. It costs `ys` 170 KB and the app 0.5 MB, compressed. macOS and
      # Windows stay as `[profile.release]` has them: stripped. See docs/releasing.md.
      - name: Keep symbols on Linux
        if: runner.os == 'Linux'
        run: echo "CARGO_PROFILE_RELEASE_STRIP=debuginfo" >> "$GITHUB_ENV"

      # `ys`, the command-line client. A separate binary because the app's has no console on
      # Windows, and because a CLI has no business carrying a webview. It is built first because
      # every bundle carries it next to the app (`tauri.bundle.conf.json` names it as a sidecar):
      # the packages put it on PATH or the app offers to, and it updates with the app. See
      # `src-tauri/src/ys.rs`.
      #
      # Inside the macOS app it is signed and notarized with the bundle, and that signed copy is
      # the one the macOS archive carries: see "Take the signed ys out of the macOS app" below.
      - name: Build the ys CLI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # One binary for both architectures, as the app bundle is.
            bun scripts/sidecar.mjs --universal
            cp src-tauri/binaries/ys-universal-apple-darwin ys
          elif [ "$RUNNER_OS" = "Windows" ]; then
            bun scripts/sidecar.mjs
            cp src-tauri/binaries/ys-x86_64-pc-windows-msvc.exe ys.exe
          else
            bun scripts/sidecar.mjs
            cp src-tauri/binaries/ys-x86_64-unknown-linux-gnu ys
          fi

      # The Linux app is built with line tables too, so a backtrace can name files and lines. In
      # the binary they would take the .deb from 15 MB to 53, so `scripts/split-debug.mjs` — the
      # release config's `beforeBundleCommand` — moves them into `yardsort.debug` before anything
      # is bundled, and they are attached to the release on their own below.
      - name: Build the Linux app with line tables
        if: runner.os == 'Linux'
        run: |
          echo "CARGO_PROFILE_RELEASE_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_STRIP=false" >> "$GITHUB_ENV"

      # `tauri.release.conf.json` switches on updater artifacts: each self-updating bundle is signed
      # with the update key, and a `latest.json` describing them is attached to the release — that
      # is what installed copies read to find out about this version. See docs/releasing.md.
      - name: Build, sign and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          tauriScript: bun tauri
          args: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.bundle.conf.json ${{ matrix.args }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # Matched to the binary by its build ID. How to use it: docs/guide/troubleshooting.md.
      - name: Attach the Linux app's debug information to the release
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          name="yardsort-${TAG#v}-linux-x86_64.debug"
          cp target/release/yardsort.debug "$name"
          gh release upload "$TAG" "$name" --clobber
          echo "attached $name"

      # The macOS archive carries the copy of `ys` from inside the app, not the one built above.
      # Tauri signs it with the bundle, and Apple's notary service issues a ticket for every
      # executable in what it is sent, so that file is signed and notarized in its own right — and
      # no certificate has to be imported a second time, which `tauri-action` leaves no room for.
      # A ticket cannot be stapled to a bare executable, so Gatekeeper looks this one up online
      # the first time a quarantined copy runs. The unsigned one was refused outright (#93).
      - name: Take the signed ys out of the macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::warning::This macOS build is unsigned, so the standalone ys is too."
            exit 0
          fi
          signed="target/universal-apple-darwin/release/bundle/macos/Yardsort.app/Contents/MacOS/ys"
          if [ ! -f "$signed" ]; then
            echo "::error::No ys at $signed, so the standalone ys would have gone out unsigned."
            exit 1
          fi
          cp "$signed" ys

          # Both architectures, a signature that holds outside the bundle, and our team's.
          lipo ys -verify_arch arm64 x86_64
          codesign --verify --strict --verbose=2 ys
          details="$(codesign --display --verbose=2 ys 2>&1)"
          if ! grep -qx "TeamIdentifier=$APPLE_TEAM_ID" <<<"$details"; then
            echo "::error::The ys taken from the app is not signed by our team."
            echo "$details"
            exit 1
          fi

          # Ask Apple whether it holds a ticket for this file by itself. Only a warning: the
          # app's notarization, which is what covers it, has already had to succeed above, and
          # a lookup that fails for its own reasons should not hold a release back.
          if ! codesign --verify --check-notarization -R="notarized" --verbose=2 ys; then
            echo "::warning::Could not confirm a notarization ticket for the standalone ys. Check a browser-downloaded copy on a Mac before telling anyone it is notarized."
          fi

      - name: Attach the ys CLI to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          case "$RUNNER_OS" in
            Linux)   name="ys-$version-linux-x86_64.tar.gz";   tar -czf "$name" ys ;;
            macOS)   name="ys-$version-macos-universal.tar.gz"; tar -czf "$name" ys ;;
            Windows) name="ys-$version-windows-x86_64.zip";     7z a "$name" ys.exe ;;
          esac
          gh release upload "$TAG" "$name" --clobber
          echo "attached $name"

  # The headless host, `yardsort-host` and `ys` with the systemd user unit, as a tarball per
  # architecture. Built on the oldest Ubuntu there is a runner for, so the glibc it needs is one
  # every current distribution has. See docs/guide/headless-host.md.
  host:
    name: Build the headless host (${{ matrix.arch }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
          - arch: aarch64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-host

      - name: Build, check and attach the tarball
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tarball="$(scripts/host-package.sh)"
          want="yardsort-host-${TAG#v}-linux-${{ matrix.arch }}.tar.gz"
          if [ "$(basename "$tarball")" != "$want" ]; then
            echo "::error::Built $(basename "$tarball"), expected $want. Is Cargo.toml's version the tag's?"
            exit 1
          fi
          mkdir unpacked && tar -xzf "$tarball" -C unpacked
          for program in yardsort-host ys; do
            env -i HOME="$HOME" PATH=/usr/bin:/bin "unpacked/${want%.tar.gz}/bin/$program" --version
          done
          gh release upload "$TAG" "$tarball" --clobber
          echo "attached $want"

  # The headless host's two images, slim and full, built for each architecture on its own runner
  # and pushed by digest only, with an SBOM and provenance attached. `images` below tags them once
  # all four are there. The full one is built on the slim one just pushed, by its digest.
  image:
    name: Build the host images (${{ matrix.arch }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      SLIM: ghcr.io/${{ github.repository_owner }}/yardsort-host
      FULL: ghcr.io/${{ github.repository_owner }}/yardsort-host-full
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Build and push both by digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx create --use --name host-images
          build() { # <dockerfile> <image> <metadata file> [more arguments]
            docker buildx build -f "$1" --platform "linux/${{ matrix.arch }}" \
              --sbom=true --provenance=mode=max \
              --label "org.opencontainers.image.version=${TAG#v}" \
              --output "type=image,name=$2,push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "$3" "${@:4}" .
          }
          build crates/host/Dockerfile "$SLIM" slim.json
          slim="$(jq -r '."containerimage.digest"' slim.json)"
          build crates/host/Dockerfile.full "$FULL" full.json --build-arg "SLIM=$SLIM@$slim"
          full="$(jq -r '."containerimage.digest"' full.json)"
          mkdir digests && echo "$slim" > digests/slim && echo "$full" > digests/full
          echo "slim $slim, full $full"

      - uses: actions/upload-artifact@v4
        with:
          name: host-image-digests-${{ matrix.arch }}
          path: digests/
          retention-days: 1

  # Both architectures under one tag per image, the version's and, for a release that is not a
  # pre-release, `latest`; each signed with Sigstore, keyless, as this workflow; and the release
  # notes name them. The release is published only once this has run.
  images:
    name: Tag and sign the host images
    needs: [draft, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      SLIM: ghcr.io/${{ github.repository_owner }}/yardsort-host
      FULL: ghcr.io/${{ github.repository_owner }}/yardsort-host-full
      # https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign_checksums.txt
      COSIGN_VERSION: v3.1.4
      COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: host-image-digests-*

      - name: Install cosign
        run: |
          curl -fsSL --proto =https -o cosign \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  cosign" | sha256sum -c -
          install -m 755 cosign /usr/local/bin/cosign && rm cosign

      - name: Tag, sign, and name them in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          version="${TAG#v}"
          for kind in slim full; do
            case "$kind" in slim) image="$SLIM" ;; full) image="$FULL" ;; esac
            tags=(-t "$image:$version")
            case "$TAG" in *-*) ;; *) tags+=(-t "$image:latest") ;; esac
            docker buildx imagetools create "${tags[@]}" \
              "$image@$(cat host-image-digests-amd64/$kind)" "$image@$(cat host-image-digests-arm64/$kind)"
            digest="$(docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest}}' | jq -r .digest)"
            cosign sign --yes "$image@$digest"
            echo "$image:$version  $digest"
          done
          gh release view "$TAG" --json body -q .body > notes.md
          if ! grep -q '^## Container images' notes.md; then
            {
              echo
              echo "## Container images"
              echo
              echo "For the headless host, for amd64 and arm64, signed with Sigstore:"
              echo
              echo "- \`$FULL:$version\`, with the tools agents use and the harnesses that may be redistributed"
              echo "- \`$SLIM:$version\`, the host alone, to build your own on"
              echo
              echo "See [In a container](https://yardsort.sh/docs/guide/headless-host#in-a-container)."
            } >> notes.md
            gh release edit "$TAG" --notes-file notes.md
          fi

  publish:
    name: Publish release
    needs: [draft, build, host, images]
    runs-on: ubuntu-24.04
    steps:
      # An installed copy that finds no `latest.json` cannot update, silently. Refuse to publish
      # a release that would strand them.
      - name: The release must carry the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" --pattern latest.json --output latest.json
          for platform in linux-x86_64 darwin-aarch64 darwin-x86_64 windows-x86_64; do
            jq -e --arg p "$platform" '.platforms | to_entries | any(.key | startswith($p)) ' latest.json >/dev/null \
              || { echo "::error::latest.json has no entry for $platform"; jq '.platforms | keys' latest.json; exit 1; }
          done
          jq '{version, platforms: (.platforms | keys)}' latest.json

      - name: Every platform built — make the release public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json url,assets -q '.url, (.assets[] | "  " + .name)'

  # Tell the package managers (AUR, Homebrew, winget). Its own workflow, so that it can also be
  # run by hand for a release that already exists, without rebuilding anything.
  packages:
    name: Package managers
    needs: publish
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
