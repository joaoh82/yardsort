name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pull requests from forks run this with a read-only token and no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # About twice the slowest run, a cold cache included: a hang fails rather than holding a
    # pull request until GitHub's six-hour limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # A hung mirror once held a pull request's check for three hours; this takes two minutes.
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: bun install --frozen-lockfile

      - name: Frontend — format, lint, typecheck, test
        run: bun run check

      # `generate_context!` embeds the frontend at compile time, so it has to exist first.
      - name: Build frontend
        run: bun run build

      - name: Rust — format
        run: cargo fmt --all -- --check

      - name: Rust — clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The server's PostgreSQL store is tested against a real one. Linux only: the macOS and
      # Windows runners have no containers, and its tests skip the PostgreSQL half there.
      - name: PostgreSQL for the server's tests
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          docker run -d --name postgres -e POSTGRES_PASSWORD=postgres -p 127.0.0.1:55432:5432 \
            postgres:17.10-alpine
          until docker exec postgres pg_isready -U postgres; do sleep 1; done
          docker exec postgres psql -U postgres -c 'CREATE DATABASE yardsort_test'
          echo "YARDSORT_TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:55432/yardsort_test?sslmode=disable" >> "$GITHUB_ENV"
          echo "YARDSORT_REQUIRE_TEST_DATABASE=1" >> "$GITHUB_ENV"

      - name: Rust — test
        run: cargo test --workspace

      - name: TypeScript bindings are up to date
        shell: bash
        run: git diff --exit-code -- src/lib/bindings.ts

  # One whole sign-in against a real ZITADEL, through the server's container image, ending with the
  # image's own `revoke-account` signing the account out (`just server-e2e`). ZITADEL's login pages
  # are not rendered: the tool makes the two API calls they make. Linux: it needs containers.
  server-e2e:
    name: Server end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: server-e2e

      - name: PostgreSQL and ZITADEL, with the server's app
        timeout-minutes: 10
        run: bun scripts/server-dev.mjs up

      - name: Build the image, run it, sign in, revoke
        timeout-minutes: 15
        run: bun scripts/server-dev.mjs e2e

  # Installers for all three platforms. Only on main (and on demand): these are the slow,
  # expensive jobs — macOS minutes are billed at 10x on private repos.
  website:
    name: Website
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # The build renders every page in docs/ and the changelog, so a doc that breaks the site
      # fails here.
      - run: bun run build

  bundle:
    name: Bundle (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # A hung mirror once held a pull request's check for three hours; this takes two minutes.
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle

      - run: bun install --frozen-lockfile

      # Every bundle carries `ys` beside the app; see `src-tauri/src/ys.rs`.
      - name: Stage the ys sidecar
        run: bun scripts/sidecar.mjs

      - name: Build installers
        run: bun tauri build --config src-tauri/tauri.bundle.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: yardsort-${{ runner.os }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
