name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pull requests from forks run this with a read-only token and no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # About twice the slowest run, a cold cache included: a hang fails rather than holding a
    # pull request until GitHub's six-hour limit.
    timeout-minutes: 45
    env:
      # Backtraces keep their line numbers. With full debug info the tests' build takes 11 GB, not 6.6.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5

      # What a Linux runner has free depends on its image, and one ran out building the tests.
      # Nothing here uses these two. The number printed says how close it is next time.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h /

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # A hung mirror once held a pull request's check for three hours; a healthy run takes
        # about two minutes. The script's worst case is 1050s, inside this limit.
        timeout-minutes: 20
        run: bash .github/apt-install.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: bun install --frozen-lockfile

      - name: Frontend — format, lint, typecheck, test
        run: bun run check

      # `generate_context!` embeds the frontend at compile time, so it has to exist first.
      - name: Build frontend
        run: bun run build

      - name: Rust — format
        run: cargo fmt --all -- --check

      - name: Rust — clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The server's PostgreSQL store is tested against a real one. Linux only: the macOS and
      # Windows runners have no containers, and its tests skip the PostgreSQL half there.
      - name: PostgreSQL for the server's tests
        if: runner.os == 'Linux'
        timeout-minutes: 5
        # The image creates the database itself. It does that on a temporary server that listens
        # only on its socket and then restarts, so readiness is asked over TCP: asked over the
        # socket, it can say yes just before the restart.
        run: |
          docker run -d --name postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=yardsort_test \
            -p 127.0.0.1:55432:5432 postgres:17.10-alpine
          until docker exec postgres pg_isready -h 127.0.0.1 -U postgres -d yardsort_test; do sleep 1; done
          echo "YARDSORT_TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:55432/yardsort_test?sslmode=disable" >> "$GITHUB_ENV"
          echo "YARDSORT_REQUIRE_TEST_DATABASE=1" >> "$GITHUB_ENV"

      - name: Rust — test
        run: cargo test --workspace

      # After the Rust tests, which build the server's stand-in example that these run against.
      - name: Protocol client — typecheck, test
        working-directory: packages/remote-client
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test

      # Its logic runs against the same stand-in; its screens run under Jest. No phone is involved.
      - name: Phone app — typecheck, lint, test
        working-directory: apps/mobile
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun run test

      - name: TypeScript bindings are up to date
        shell: bash
        run: git diff --exit-code -- src/lib/bindings.ts

  # One whole sign-in against a real ZITADEL, through the server's container image, ending with the
  # image's own `revoke-account` signing the account out (`just server-e2e`). ZITADEL's login pages
  # are not rendered: the tool makes the two API calls they make. Linux: it needs containers.
  server-e2e:
    name: Server end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: server-e2e

      - name: PostgreSQL and ZITADEL, with the server's app
        timeout-minutes: 10
        run: bun scripts/server-dev.mjs up

      - name: Build the image, run it, sign in, revoke
        timeout-minutes: 15
        run: bun scripts/server-dev.mjs e2e

  # The headless host as it ships: the tarball, run with an empty environment, on each
  # architecture; and on x86_64 the container image, which signs in to the stand-in server, links,
  # and stops cleanly. The image is tried here only: the local smoke test runs the tarball. See
  # docs/guide/headless-host.md.
  host-package:
    name: Host package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
          - arch: aarch64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: host-package

      - name: Build the tarball
        run: echo "TARBALL=$(scripts/host-package.sh)" >> "$GITHUB_ENV"

      - name: Run it with an empty environment
        run: |
          mkdir unpacked && tar -xzf "$TARBALL" -C unpacked
          bin="$(echo unpacked/*/bin)"
          for program in yardsort-host ys; do
            env -i HOME="$HOME" PATH=/usr/bin:/bin "$bin/$program" --version
          done
          # The newest glibc it needs: the oldest distribution it runs on must have this one.
          objdump -T "$bin/yardsort-host" "$bin/ys" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - uses: oven-sh/setup-bun@v2
        if: matrix.arch == 'x86_64'
        with:
          bun-version: 1.4.2

      # Its user is the runner's, as an operator makes it the repositories' owner.
      - name: Build the image
        if: matrix.arch == 'x86_64'
        run: |
          docker build -f crates/host/Dockerfile --build-arg UID="$(id -u)" --build-arg GID="$(id -g)" \
            -t yardsort-host .
          docker run --rm yardsort-host --version
          docker run --rm --entrypoint ys yardsort-host --version

      - name: The image signs in to the stand-in, links, and stops cleanly
        if: matrix.arch == 'x86_64'
        timeout-minutes: 15
        env:
          YS_RUN_DIR: ${{ runner.temp }}/host-image
          YS_INPUT_BUILD: image
        run: |
          cargo build -q -p yardsort-server --example stand-in
          mkdir -p "$YS_RUN_DIR/profile" && mkdir -m 700 "$YS_RUN_DIR/credentials"
          (tail -f /dev/null | target/debug/examples/stand-in > "$YS_RUN_DIR/stand-in.json") &
          until grep -q ready "$YS_RUN_DIR/stand-in.json" 2>/dev/null; do sleep 1; done
          bun .yardsort/tests/support/host.ts "$YS_RUN_DIR" sign-in "CI box"
          docker run -d --name host --network host -v "$YS_RUN_DIR/profile:/data" \
            -v "$YS_RUN_DIR/credentials:/credentials" yardsort-host
          for _ in $(seq 60); do
            docker exec host yardsort-host status | tee status.txt | grep -q "Link: connected" && break
            sleep 1
          done
          cat status.txt
          grep -q "Link: connected" status.txt
          docker stop host
          code="$(docker inspect host --format '{{.State.ExitCode}}')"
          docker logs host
          [ "$code" = 0 ] || { echo "::error::serve exited $code when stopped"; exit 1; }

  # Installers for all three platforms. Only on main (and on demand): these are the slow,
  # expensive jobs — macOS minutes are billed at 10x on private repos.
  website:
    name: Website
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # The build renders every page in docs/ and the changelog, so a doc that breaks the site
      # fails here.
      - run: bun run build

  bundle:
    name: Bundle (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # A hung mirror once held a pull request's check for three hours; a healthy run takes
        # about two minutes. The script's worst case is 1050s, inside this limit.
        timeout-minutes: 20
        run: bash .github/apt-install.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle

      - run: bun install --frozen-lockfile

      # Every bundle carries `ys` beside the app; see `src-tauri/src/ys.rs`.
      - name: Stage the ys sidecar
        run: bun scripts/sidecar.mjs

      - name: Build installers
        run: bun tauri build --config src-tauri/tauri.bundle.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: yardsort-${{ runner.os }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
