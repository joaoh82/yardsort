name: TestFlight

# Builds the phone app's release identity (`Yardsort`, dev.yardsort.mobile) and uploads it to App
# Store Connect for internal testers, on request only (Actions → TestFlight → Run workflow), from
# whichever branch it is run from. What `just mobile-testflight` and Xcode's Archive do on a Mac,
# with no Xcode account: it signs by hand with a distribution certificate and an App Store profile,
# and uploads with `altool` and an App Store Connect API key. Those live in the `testflight`
# environment; the README says how to make them (apps/mobile/README.md#from-github-actions).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and upload
    runs-on: macos-26
    environment: testflight
    # A first build, with the pods to fetch and compile, is the slow one.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      APP_VARIANT: release
    steps:
      - uses: actions/checkout@v5

      - name: The secrets are all there
        env:
          IOS_DISTRIBUTION_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          missing=0
          for name in IOS_DISTRIBUTION_CERTIFICATE IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE \
            APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set in the testflight environment. See apps/mobile/README.md#from-github-actions."
              missing=1
            fi
          done
          exit "$missing"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Expo's command line runs on Node.js.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Xcode
        run: xcodebuild -version

      - run: bun install --frozen-lockfile

      # TestFlight refuses a build number it has seen. From the time in UTC, as the recipe's, so a
      # build from here and one from a Mac never go backwards. Prebuild runs `pod install` too.
      - name: Generate the iOS project
        run: |
          build="$(date -u +%y%m%d.%H%M)"
          echo "Build number $build"
          YARDSORT_BUILD_NUMBER="$build" bunx expo prebuild --platform ios --clean

      # A keychain of its own, unlocked for this job only, with the certificate's key usable by
      # codesign without asking.
      - name: Install the certificate
        env:
          IOS_DISTRIBUTION_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/testflight.keychain-db"
          password="$(uuidgen)"
          certificate="$RUNNER_TEMP/distribution.p12"
          trap 'rm -f "$certificate"' EXIT
          echo "$IOS_DISTRIBUTION_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Sign with the profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          profile="$RUNNER_TEMP/testflight.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$profile"
          bun scripts/ios-signing.ts "$profile" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive
        run: >-
          xcodebuild archive -workspace ios/Yardsort.xcworkspace -scheme Yardsort
          -configuration Release -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/Yardsort.xcarchive"

      - name: Export the IPA
        run: >-
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Yardsort.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          -exportPath "$RUNNER_TEMP/export"

      # Kept for a week, so a build Apple refuses can be looked at, or uploaded with Transporter.
      - uses: actions/upload-artifact@v4
        with:
          name: Yardsort-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7

      # Apple processes the build after this, and App Store Connect shows nothing of it until that
      # is done. A problem found then comes by email.
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          # altool finds the key by its ID, as AuthKey_<id>.p8 in this folder.
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/keys"
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          trap 'rm -rf "$API_PRIVATE_KEYS_DIR"' EXIT
          printf '%s\n' "$APP_STORE_CONNECT_KEY" > "$API_PRIVATE_KEYS_DIR/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file "$(ls "$RUNNER_TEMP"/export/*.ipa)" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/testflight.keychain-db" 2>/dev/null || true
