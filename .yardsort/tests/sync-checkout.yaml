id: sync-checkout
name: Another computer's workspace is checked out here only when asked, and never over work here
description: >-
  Two computers with no screen, each a yardsort-host profile of its own, signed in to the stand-in
  as the same account, each with a clone of one repository whose remote is a folder both reach. A
  project synced on the first is linked on the second. The first makes a workspace, commits in it
  and pushes its branch. On the second, the workspace is listed, and nothing is made for it until
  `yardsort-host sync checkout` is run at a terminal: refused from a shell that is not one. Then
  the branch is fetched, at the first's commit, and a workspace of the second's own is made on it,
  while the first's is still listed as the first's. Last, with that workspace deleted and a commit
  of the second's own on the branch, checking it out again is refused and the branch is left as it
  is. Linux only.
version: 1
timeout: 45m

setup:
  - id: build
    action: shell
    line: sh .yardsort/tests/support/headless-build.sh
    timeout: 30m
  - id: stand_in
    action: start
    program: sh
    args:
      - -c
      # It stops when its input closes.
      - tail -f /dev/null | target/debug/examples/stand-in > "{{ run.dir }}/stand-in.json"
  - id: stand_in_ready
    action: wait_for
    program: grep
    args: [-q, ready, "{{ run.dir }}/stand-in.json"]
    timeout: 60s
  - id: one_remote_and_a_clone_on_each_computer
    action: shell
    line: >-
      for at in here there; do mkdir -p "$YS_RUN_DIR/$at" && cp .yardsort/tests/support/headless-settings.toml
      "$YS_RUN_DIR/$at/settings.toml"; done && git init -q --bare -b main "$YS_RUN_DIR/origin.git" && git clone -q
      "$YS_RUN_DIR/origin.git" "$YS_RUN_DIR/widgets" 2> /dev/null && git -C "$YS_RUN_DIR/widgets" checkout -q -b
      main && git -C "$YS_RUN_DIR/widgets" -c user.name=Smoke -c user.email=smoke@example.invalid -c
      commit.gpgsign=false commit -q --allow-empty -m first && git -C "$YS_RUN_DIR/widgets" push -q origin main &&
      git clone -q "$YS_RUN_DIR/origin.git" "$YS_RUN_DIR/widgets-copy"

steps:
  - id: sign_in_both
    action: shell
    line: >-
      for at in here there; do YS_PROFILE="$YS_RUN_DIR/$at" bun .yardsort/tests/support/host.ts "$YS_RUN_DIR"
      sign-in "$at" || exit 1; done
    expect:
      stdout_contains: Signed in as there
  - id: serve_both
    action: shell
    line: >-
      for at in here there; do YS_PROFILE="$YS_RUN_DIR/$at" setsid sh .yardsort/tests/support/headless.sh
      yardsort-host serve > "$YS_RUN_DIR/$at.log" 2>&1 < /dev/null & echo $! > "$YS_RUN_DIR/$at.pid"; done
  - id: both_linked
    action: wait_for
    program: sh
    args:
      - -c
      - >-
        for at in here there; do YS_PROFILE="$YS_RUN_DIR/$at" sh .yardsort/tests/support/headless.sh
        yardsort-host status | grep -q "Link: connected" || exit 1; done
    timeout: 60s
  - id: the_project_syncs_on_both
    action: shell
    line: >-
      YS_PROFILE="$YS_RUN_DIR/here" sh .yardsort/tests/support/headless.sh ys project add "$YS_RUN_DIR/widgets"
      && YS_PROFILE="$YS_RUN_DIR/there" sh .yardsort/tests/support/headless.sh ys project add
      "$YS_RUN_DIR/widgets-copy" && printf 'y\n' | YS_PROFILE="$YS_RUN_DIR/here" script -qefc "sh
      .yardsort/tests/support/headless.sh yardsort-host sync on widgets" /dev/null > /dev/null && for i in $(seq
      60); do YS_PROFILE="$YS_RUN_DIR/here" sh .yardsort/tests/support/headless.sh ys sync status | grep -Eq
      "widgets +syncing" && break; sleep 1; done && YS_PROFILE="$YS_RUN_DIR/there" script -qefc "sh
      .yardsort/tests/support/headless.sh yardsort-host sync link widgets-copy widgets" /dev/null < /dev/null
    expect:
      stdout_contains: widgets-copy is linked to the synced widgets
  - id: the_first_makes_a_workspace_commits_and_pushes
    action: shell
    line: >-
      YS_PROFILE="$YS_RUN_DIR/here" sh .yardsort/tests/support/headless.sh ys workspace new widgets "Fix the
      login" --harness sh > /dev/null && at=$(YS_PROFILE="$YS_RUN_DIR/here" sh .yardsort/tests/support/headless.sh
      ys workspace list --project widgets --json | bun .yardsort/tests/support/workspace-path.ts login) && git -C
      "$at" -c user.name=Smoke -c user.email=smoke@example.invalid -c commit.gpgsign=false commit -q --allow-empty
      -m "the login, fixed" && git -C "$at" push -q origin HEAD && git -C "$at" rev-parse HEAD | tee
      "$YS_RUN_DIR/pushed"
  - id: listed_on_the_second
    action: wait_for
    program: sh
    args:
      - -c
      - >-
        YS_PROFILE="$YS_RUN_DIR/there" sh .yardsort/tests/support/headless.sh ys sync status | grep -Eq "^  [^ ]*login[^
        ]*  on here  ys/"
    timeout: 60s
  - id: nothing_made_for_it_yet
    action: shell
    line: >-
      git -C "$YS_RUN_DIR/widgets-copy" branch --list "ys/*" | wc -l; YS_PROFILE="$YS_RUN_DIR/there" sh
      .yardsort/tests/support/headless.sh ys workspace list --project widgets-copy --json | bun
      .yardsort/tests/support/workspace-path.ts login || echo none
    expect:
      stdout_matches: "^0\\s+none"
  - id: not_from_a_shell_that_is_not_a_terminal
    action: shell
    line: >-
      YS_PROFILE="$YS_RUN_DIR/there" sh .yardsort/tests/support/headless.sh yardsort-host sync checkout
      widgets-copy fix-login < /dev/null
    expect:
      exit: nonzero
  - id: check_it_out_at_the_operators_terminal
    action: shell
    line: >-
      YS_PROFILE="$YS_RUN_DIR/there" script -qefc "sh .yardsort/tests/support/headless.sh yardsort-host sync
      checkout widgets-copy fix-login" /dev/null < /dev/null
    expect:
      stdout_contains: is checked out here as
  - id: at_the_first_computers_commit
    action: shell
    line: >-
      at=$(YS_PROFILE="$YS_RUN_DIR/there" sh .yardsort/tests/support/headless.sh ys workspace list --project
      widgets-copy --json | bun .yardsort/tests/support/workspace-path.ts login) && [ "$(git -C "$at" rev-parse
      HEAD)" = "$(cat "$YS_RUN_DIR/pushed")" ] && git -C "$at" rev-parse --abbrev-ref @{upstream}
    expect:
      stdout_matches: "^origin/ys/"
  - id: and_the_first_computers_still_listed_as_its
    action: shell
    line: YS_PROFILE="$YS_RUN_DIR/there" sh .yardsort/tests/support/headless.sh ys sync status
    expect:
      stdout_matches: "  [^ ]*login[^ ]*  on here  ys/"
  - id: work_of_its_own_on_the_branch_here
    action: shell
    # The workspace goes, its branch stays, and a commit only this computer has goes on it.
    line: >-
      branch=$(YS_PROFILE="$YS_RUN_DIR/there" sh .yardsort/tests/support/headless.sh ys workspace list --project
      widgets-copy --json | bun .yardsort/tests/support/workspace-path.ts login branch) && name=$(basename "$(
      YS_PROFILE="$YS_RUN_DIR/there" sh .yardsort/tests/support/headless.sh ys workspace list --project widgets-copy
      --json | bun .yardsort/tests/support/workspace-path.ts login)") && YS_PROFILE="$YS_RUN_DIR/there" sh
      .yardsort/tests/support/headless.sh ys workspace delete "$name" --force > /dev/null && git -C
      "$YS_RUN_DIR/widgets-copy" checkout -q "$branch" && git -C "$YS_RUN_DIR/widgets-copy" -c user.name=Smoke -c
      user.email=smoke@example.invalid -c commit.gpgsign=false commit -q --allow-empty -m "only here" && git -C
      "$YS_RUN_DIR/widgets-copy" checkout -q main && git -C "$YS_RUN_DIR/widgets-copy" rev-parse "$branch" | tee
      "$YS_RUN_DIR/mine" && echo "$branch" > "$YS_RUN_DIR/branch"
  - id: checking_it_out_again_is_refused
    action: shell
    line: >-
      YS_PROFILE="$YS_RUN_DIR/there" script -qefc "sh .yardsort/tests/support/headless.sh yardsort-host sync
      checkout widgets-copy fix-login" /dev/null < /dev/null
    expect:
      exit: nonzero
      stdout_contains: commit that origin's has not
  - id: and_the_branch_is_left_as_it_is
    action: shell
    line: >-
      [ "$(git -C "$YS_RUN_DIR/widgets-copy" rev-parse "$(cat "$YS_RUN_DIR/branch")")" = "$(cat
      "$YS_RUN_DIR/mine")" ] && { YS_PROFILE="$YS_RUN_DIR/there" sh .yardsort/tests/support/headless.sh ys workspace
      list --project widgets-copy --json | bun .yardsort/tests/support/workspace-path.ts login || echo no workspace;
      }
    expect:
      stdout_contains: no workspace

teardown:
  - id: stop_everything
    action: shell
    line: >-
      for at in here there; do kill "$(cat "$YS_RUN_DIR/$at.pid" 2>/dev/null)" 2>/dev/null; done; pkill -HUP -f
      "yardsort-daemon .*$YS_RUN_DIR"; pkill -f "yardsort-daemon .*$YS_RUN_DIR"; true
