id: remote-start-from-phone
name: A phone starts a workspace and gives its agent a picture
description: >-
  Turns Remote on in the real window against the stand-in server and pairs a pretend phone that
  may type. The phone is offered this computer's agents, starts a new workspace with one and a first
  message, watches it print, and the window shows the workspace without being touched. Then it
  uploads a picture, which lands whole outside every worktree. The agent is the shell, so nothing is
  asked of a real one. Linux only, since it stands in for the browser with xdg-open. A window opens
  while it runs; nothing needs clicking.
version: 1
timeout: 45m

setup:
  - id: build_app
    action: run
    program: bun
    args: [tauri, build, --debug, --no-bundle]
    timeout: 20m
  - id: build_stand_in
    action: run
    program: cargo
    args: [build, -q, -p, yardsort-server, --example, stand-in]
    timeout: 15m
  - id: stand_in
    action: start
    program: sh
    args:
      - -c
      # It stops when its input closes.
      - tail -f /dev/null | target/debug/examples/stand-in > "{{ run.dir }}/stand-in.json"
  - id: stand_in_ready
    action: wait_for
    program: grep
    args: [-q, ready, "{{ run.dir }}/stand-in.json"]
    timeout: 60s
  - id: seed
    action: shell
    line: sh .yardsort/tests/support/app.sh seed
  - id: open_app
    action: shell
    line: sh .yardsort/tests/support/app.sh open
  - id: window_up
    action: wait_for
    port: "{{ run.port }}"
    timeout: 60s

steps:
  - id: add_the_project
    action: run
    program: bun
    args: [.yardsort/tests/support/window.ts, "{{ run.port }}", add-project, "{{ run.dir }}"]
    timeout: 60s
  - id: turn_on
    action: run
    program: bun
    args: [.yardsort/tests/support/window.ts, "{{ run.port }}", turn-on, "{{ run.dir }}"]
    timeout: 90s
  - id: show_a_code
    action: run
    program: bun
    args: [.yardsort/tests/support/window.ts, "{{ run.port }}", pairing-code, "{{ run.dir }}"]
  - id: phone_asks
    action: run
    program: bun
    args: [.yardsort/tests/support/phone.ts, "{{ run.dir }}", ask]
  - id: let_it_in
    action: run
    program: bun
    args: [.yardsort/tests/support/window.ts, "{{ run.port }}", let-it-in]
  - id: phone_starts_work
    action: run
    program: bun
    args: [.yardsort/tests/support/phone.ts, "{{ run.dir }}", starts, Smoke computer]
    timeout: 120s
    expect:
      stdout_contains: outside every worktree
  - id: window_shows_it
    action: run
    program: bun
    args: [.yardsort/tests/support/window.ts, "{{ run.port }}", sees, echo-started]
    timeout: 60s

teardown:
  - id: close_everything
    action: shell
    line: sh .yardsort/tests/support/app.sh stop-everything
