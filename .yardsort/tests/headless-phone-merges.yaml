id: headless-phone-merges
name: A phone merges a workspace's pull request on a computer with no screen
description: >-
  Runs yardsort-host with no display variables against the stand-in server, with one project on a
  branch with pull request 12, and pairs a pretend phone that may type. A stand-in gh answers for
  the pull requests from a file and says yes to a merge; the host finds programs through a shell
  that reads no startup files, and the remote is under a name reserved for tests, so no forge is
  asked. The phone reads where the checkout stands, for the commit at the pull request's head. A
  merge at another commit is refused in the host's words and gh is not asked to merge; at the head,
  gh is asked to squash exactly that commit. Linux only. No window opens.
version: 1
timeout: 45m

setup:
  - id: build
    action: shell
    line: sh .yardsort/tests/support/headless-build.sh
    timeout: 30m
  - id: stand_in
    action: start
    program: sh
    args:
      - -c
      # It stops when its input closes.
      - tail -f /dev/null | target/debug/examples/stand-in > "{{ run.dir }}/stand-in.json"
  - id: stand_in_ready
    action: wait_for
    program: grep
    args: [-q, ready, "{{ run.dir }}/stand-in.json"]
    timeout: 60s
  - id: a_repository_on_trunk
    action: shell
    line: >-
      mkdir -p "$YS_RUN_DIR/repo" "$YS_RUN_DIR/profile" && git -C "$YS_RUN_DIR/repo" init -q -b trunk
      && git -C "$YS_RUN_DIR/repo" -c user.name=Smoke -c user.email=smoke@example.invalid -c
      commit.gpgsign=false commit -q --allow-empty -m first && cp
      .yardsort/tests/support/headless-settings.toml "$YS_RUN_DIR/profile/settings.toml"
  - id: seed_a_pull_request
    # The app's seeding, in a folder of its own since $YS_RUN_DIR/bin is the build's: a branch
    # with pull request 12, a gh answering from a file in app/bin, and a login shell in
    # app/loginshell that puts it first. Its remote is a forge's address; here it is moved under a
    # name reserved for tests.
    action: shell
    line: >-
      YS_APP_DIR="$YS_RUN_DIR/app" sh .yardsort/tests/support/app.sh seed-a-pull-request && git -C "$YS_RUN_DIR/repo" remote
      set-url origin https://git.example.test/orchard/demo.git

steps:
  - id: the_host_signs_in
    action: run
    program: bun
    args: [.yardsort/tests/support/host.ts, "{{ run.dir }}", sign-in, Smoke box]
    expect:
      stdout_contains: Signed in as Smoke box
  - id: serve
    action: shell
    line: >-
      SHELL="$YS_RUN_DIR/app/loginshell" PATH="$YS_RUN_DIR/app/bin:$PATH" setsid sh
      .yardsort/tests/support/headless.sh yardsort-host serve > "$YS_RUN_DIR/serve.log" 2>&1 <
      /dev/null & echo $! > "$YS_RUN_DIR/serve.pid"
  - id: linked
    action: wait_for
    program: sh
    args:
      - -c
      - 'sh .yardsort/tests/support/headless.sh yardsort-host status | grep -q "Link: connected"'
    timeout: 60s
  - id: add_the_project
    action: run
    program: sh
    args: [.yardsort/tests/support/headless.sh, ys, project, add, "{{ run.dir }}/repo"]
    expect:
      stdout_contains: Added repo
  - id: pair_a_phone
    action: run
    program: bun
    args: [.yardsort/tests/support/host.ts, "{{ run.dir }}", pair]
    timeout: 120s
    expect:
      stdout_contains: Let in.
  - id: a_merge_at_another_commit_is_refused
    action: run
    program: bun
    args: [.yardsort/tests/support/phone.ts, "{{ run.dir }}", merges, Smoke box, stale]
    timeout: 90s
    expect:
      stdout_contains: "refused: The pull request changed or is no longer ready to merge"
  - id: the_stand_in_was_asked_and_merged_nothing
    action: shell
    # Asked for the list, so it is the gh the host found; and not asked to merge.
    line: grep -q "^pr list " "$YS_RUN_DIR/app/gh/asked" && ! grep -q "^pr merge" "$YS_RUN_DIR/app/gh/asked" && echo "nothing merged"
    expect:
      stdout_contains: nothing merged
  - id: a_merge_at_its_head
    action: run
    program: bun
    args: [.yardsort/tests/support/phone.ts, "{{ run.dir }}", merges, Smoke box]
    timeout: 90s
    expect:
      stdout_contains: "merged #12 at"
  - id: goes_to_gh_for_exactly_that_commit
    action: shell
    line: >-
      grep -q "^pr merge 12 --squash --match-head-commit $(git -C "$YS_RUN_DIR/repo" rev-parse HEAD)$"
      "$YS_RUN_DIR/app/gh/asked" && echo "merged at the head it was shown"
    expect:
      stdout_contains: merged at the head it was shown

teardown:
  - id: stop_everything
    action: shell
    line: >-
      kill "$(cat "$YS_RUN_DIR/serve.pid" 2>/dev/null)" 2>/dev/null; pkill -HUP -f "yardsort-daemon
      .*$YS_RUN_DIR"; pkill -f "yardsort-daemon .*$YS_RUN_DIR"; true
