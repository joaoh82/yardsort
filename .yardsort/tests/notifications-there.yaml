id: notifications-there
name: The window lists what finished on a computer with no screen, and marks it seen there
description: >-
  A yardsort-host on the stand-in server, with an agent that is really a shell running a script of
  the repository: it prints for ten seconds, as one at work does, and then waits. The host keeps a Notifications list, so the agent
  that finished is a row of it before anyone is paired. The real window, on a profile of its own,
  signs in as a client and is let watch at the host's terminal. Its Notifications row then counts
  the host's unseen row, and the list names the host on it. A second agent that finishes on the
  host afterwards shows within seconds, since the host says when its list changes. One row is
  marked seen from the window and is seen in the host's own records; the other opens its workspace
  on the host. Linux only, since the window stands in for the browser with xdg-open. A window opens
  while it runs; nothing needs clicking.
version: 1
timeout: 45m

setup:
  - id: build_app
    action: run
    program: bun
    args: [tauri, build, --debug, --no-bundle]
    timeout: 20m
  - id: build_the_host
    action: shell
    # The stand-in server too, and the host's bin folder in $YS_RUN_DIR/bin.
    line: sh .yardsort/tests/support/headless-build.sh
    timeout: 30m
  - id: stand_in
    action: start
    program: sh
    args:
      - -c
      # It stops when its input closes.
      - tail -f /dev/null | target/debug/examples/stand-in > "{{ run.dir }}/stand-in.json"
  - id: stand_in_ready
    action: wait_for
    program: grep
    args: [-q, ready, "{{ run.dir }}/stand-in.json"]
    timeout: 60s
  - id: a_repository_and_an_agent_that_is_a_shell
    action: shell
    line: >-
      mkdir -p "$YS_RUN_DIR/repo" "$YS_RUN_DIR/profile" && git -C "$YS_RUN_DIR/repo" init -q && git -C
      "$YS_RUN_DIR/repo" -c user.name=Smoke -c user.email=smoke@example.invalid -c commit.gpgsign=false
      commit -q --allow-empty -m first && cp .yardsort/tests/support/work.sh "$YS_RUN_DIR/repo/work" &&
      chmod +x "$YS_RUN_DIR/repo/work" && git -C "$YS_RUN_DIR/repo" add work && git -C "$YS_RUN_DIR/repo"
      -c user.name=Smoke -c user.email=smoke@example.invalid -c commit.gpgsign=false commit -q -m
      "An agent at work" && cp .yardsort/tests/support/headless-settings.toml
      "$YS_RUN_DIR/profile/settings.toml"

steps:
  - id: the_host_signs_in
    action: run
    program: bun
    args: [.yardsort/tests/support/host.ts, "{{ run.dir }}", sign-in, Smoke box]
    expect:
      stdout_contains: Signed in as Smoke box
  - id: serve
    action: shell
    line: >-
      setsid sh .yardsort/tests/support/headless.sh yardsort-host serve > "$YS_RUN_DIR/serve.log"
      2>&1 < /dev/null & echo $! > "$YS_RUN_DIR/serve.pid"
  - id: linked
    action: wait_for
    program: sh
    args:
      - -c
      - 'sh .yardsort/tests/support/headless.sh yardsort-host status | grep -q "Link: connected"'
    timeout: 60s
  - id: add_the_project
    action: run
    program: sh
    args: [.yardsort/tests/support/headless.sh, ys, project, add, "{{ run.dir }}/repo"]
    expect:
      stdout_contains: Added repo
  - id: an_agent_works_and_then_waits
    action: run
    program: sh
    args:
      - .yardsort/tests/support/headless.sh
      - ys
      - workspace
      - new
      - repo
      # The message is what the agent runs, and names the workspace: `work-first`. Ten seconds
      # of printing is a stretch of work; after it the terminal is quiet.
      - ./work first
      - --harness
      - sh-agent
    expect:
      stdout_contains: created  work-first
  - id: the_host_lists_it_with_nobody_paired
    action: wait_for
    program: sh
    args:
      - -c
      - >-
        test "$(sqlite3 "{{ run.dir }}/profile/yardsort.db" "SELECT count(*) FROM notifications WHERE
        kind = 'agent.finished' AND settled_at IS NULL")" = 1
    timeout: 60s

  - id: open_the_window
    action: shell
    # A profile of its own: the host has the run's.
    line: YS_APP_DIR="$YS_RUN_DIR/app" sh .yardsort/tests/support/app.sh open
  - id: window_up
    action: wait_for
    port: "{{ run.port }}"
    timeout: 60s
  - id: the_window_signs_in_as_a_client
    action: run
    program: bun
    args: [.yardsort/tests/support/window.ts, "{{ run.port }}", client-sign-in, "{{ run.dir }}"]
    timeout: 90s
    expect:
      stdout_contains: "saw: Signed in as Smoke laptop"
  - id: paired_at_the_hosts_terminal
    action: run
    program: bun
    args: [.yardsort/tests/support/host.ts, "{{ run.dir }}", pair, window, "{{ run.port }}"]
    timeout: 120s
    expect:
      stdout_contains: Let in.
  - id: the_window_lists_the_hosts_row
    action: run
    program: bun
    args: [.yardsort/tests/support/window.ts, "{{ run.port }}", lists-there, Smoke box, "1"]
    timeout: 120s
    expect:
      stdout_contains: "saw: 1 unseen row, each on Smoke box"

  - id: a_second_agent_works_and_then_waits
    action: run
    program: sh
    args:
      - .yardsort/tests/support/headless.sh
      - ys
      - workspace
      - new
      - repo
      - ./work second
      - --harness
      - sh-agent
    expect:
      stdout_contains: created  work-second
  - id: the_window_hears_of_it
    action: run
    program: bun
    args: [.yardsort/tests/support/window.ts, "{{ run.port }}", lists-there, Smoke box, "2"]
    timeout: 120s
    expect:
      stdout_contains: "saw: 2 unseen rows, each on Smoke box"
  - id: one_is_marked_seen_from_the_window
    action: run
    program: bun
    args:
      [.yardsort/tests/support/window.ts, "{{ run.port }}", marks-seen-there, Smoke box, work-first]
    timeout: 60s
    expect:
      stdout_contains: "saw: work-first on Smoke box, seen"
  - id: it_is_seen_on_the_host
    action: wait_for
    program: sh
    args:
      - -c
      - >-
        test "$(sqlite3 "{{ run.dir }}/profile/yardsort.db" "SELECT count(*) FROM notifications WHERE
        kind = 'agent.finished' AND settled_at IS NOT NULL")" = 1 && test "$(sqlite3 "{{ run.dir
        }}/profile/yardsort.db" "SELECT count(*) FROM notifications WHERE kind = 'agent.finished' AND
        settled_at IS NULL")" = 1
    timeout: 30s
  - id: the_other_opens_its_workspace_there
    action: run
    program: bun
    args:
      [
        .yardsort/tests/support/window.ts,
        "{{ run.port }}",
        opens-there-from-the-list,
        Smoke box,
        work-second,
      ]
    timeout: 60s
    expect:
      stdout_contains: "saw: work-second on Smoke box, opened from its row"

teardown:
  - id: stop_everything
    action: shell
    line: >-
      YS_APP_DIR="$YS_RUN_DIR/app" sh .yardsort/tests/support/app.sh stop-everything; kill "$(cat
      "$YS_RUN_DIR/serve.pid" 2>/dev/null)" 2>/dev/null; pkill -HUP -f "yardsort-daemon .*$YS_RUN_DIR";
      pkill -f "yardsort-daemon .*$YS_RUN_DIR"; true
