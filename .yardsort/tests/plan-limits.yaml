id: plan-limits
name: A plan with no room holds back only what is new, and what was there keeps working
description: >-
  R7 slice 4 (docs/design/46-remote-r7.md §11). The stand-in server asks a stand-in entitlements
  service (support/plans.ts), whose answers this test changes as it goes. A computer with no
  screen signs in and serves; its project's note is held back by a plan with no room for synced
  data, which ys sync status says in the plan's words, while the computer stays linked. A pretend
  phone pairs with it and is refused connecting, told why in the same way. Once the plan has room,
  the phone connects and the note goes up. Then a plan with no room for another device: a new
  phone is not signed in, and the paired one still connects. Every question the server asked
  carried the token and named no person and no device. Linux only. No window opens.
version: 1
timeout: 45m

setup:
  - id: build
    action: shell
    line: sh .yardsort/tests/support/headless-build.sh
    timeout: 30m
  - id: a_plan_with_no_room_for_connections_or_synced_data
    action: shell
    line: >-
      printf '%s' '{"stream": {"allowed": false, "message": "Your plan has no connections to
      computers."}, "sync": {"allowed": false, "message": "Your plan has no room for synced
      notes."}}' > "$YS_RUN_DIR/plans.json"
  - id: plans
    action: start
    program: sh
    args:
      - -c
      # It stops when its input closes.
      - tail -f /dev/null | bun .yardsort/tests/support/plans.ts "{{ run.dir }}"
  - id: plans_ready
    action: wait_for
    program: test
    args: [-s, "{{ run.dir }}/plans-url"]
    timeout: 30s
  - id: stand_in
    action: start
    program: sh
    args:
      - -c
      - >-
        tail -f /dev/null | YARDSORT_ENTITLEMENTS_URL="$(cat "{{ run.dir }}/plans-url")"
        YARDSORT_ENTITLEMENTS_TOKEN=smoke-entitlements-token target/debug/examples/stand-in >
        "{{ run.dir }}/stand-in.json"
  - id: stand_in_ready
    action: wait_for
    program: grep
    args: [-q, ready, "{{ run.dir }}/stand-in.json"]
    timeout: 60s
  - id: a_repository
    action: shell
    line: >-
      mkdir -p "$YS_RUN_DIR/widgets" "$YS_RUN_DIR/profile" && git -C "$YS_RUN_DIR/widgets" init -q &&
      git -C "$YS_RUN_DIR/widgets" -c user.name=Smoke -c user.email=smoke@example.invalid -c
      commit.gpgsign=false commit -q --allow-empty -m first && cp
      .yardsort/tests/support/headless-settings.toml "$YS_RUN_DIR/profile/settings.toml"

steps:
  - id: sign_in_the_computer
    action: run
    program: bun
    args: [.yardsort/tests/support/host.ts, "{{ run.dir }}", sign-in, Smoke box]
    expect:
      stdout_contains: Signed in as Smoke box
  - id: serve
    action: shell
    line: >-
      setsid sh .yardsort/tests/support/headless.sh yardsort-host serve > "$YS_RUN_DIR/serve.log"
      2>&1 < /dev/null & echo $! > "$YS_RUN_DIR/serve.pid"
  - id: linked
    action: wait_for
    program: sh
    args:
      - -c
      - 'sh .yardsort/tests/support/headless.sh yardsort-host status | grep -q "Link: connected"'
    timeout: 60s
  - id: a_note_is_held_back_in_the_plans_words
    action: shell
    line: >-
      sh .yardsort/tests/support/headless.sh ys project add "$YS_RUN_DIR/widgets" && printf 'y\n' |
      script -qefc "sh .yardsort/tests/support/headless.sh yardsort-host sync on widgets" /dev/null >
      /dev/null && script -qefc "sh .yardsort/tests/support/headless.sh yardsort-host memory write
      widgets 'A note the plan holds back.'" /dev/null < /dev/null && for i in $(seq 90); do sh
      .yardsort/tests/support/headless.sh ys sync status > "$YS_RUN_DIR/sync-status" && grep -q "Last
      problem: Your plan has no room for synced notes." "$YS_RUN_DIR/sync-status" && cat
      "$YS_RUN_DIR/sync-status" && exit 0; sleep 1; done; cat "$YS_RUN_DIR/sync-status"; exit 1
    timeout: 3m
    expect:
      stdout_contains: Waiting to go up
  - id: still_linked
    action: run
    program: sh
    args: [.yardsort/tests/support/headless.sh, yardsort-host, status]
    expect:
      stdout_contains: "Link: connected"
  - id: pair_a_phone
    action: run
    program: bun
    args: [.yardsort/tests/support/host.ts, "{{ run.dir }}", pair]
    timeout: 90s
    expect:
      stdout_contains: Let in.
  - id: the_phone_is_refused_connecting
    action: run
    program: bun
    args: [.yardsort/tests/support/phone.ts, "{{ run.dir }}", held-back, Smoke box]
    expect:
      stdout_contains: "told: Your plan has no connections to computers."
  - id: the_plan_has_room
    action: shell
    line: printf '{}' > "$YS_RUN_DIR/plans.json"
  - id: the_phone_connects
    action: wait_for
    program: sh
    args:
      - -c
      - bun .yardsort/tests/support/phone.ts "$YS_RUN_DIR" reaches "Smoke box" | grep -q "welcomed by"
    # The server keeps an answer for a minute.
    timeout: 3m
  - id: the_note_goes_up
    action: wait_for
    program: sh
    args:
      - -c
      - >-
        sh .yardsort/tests/support/headless.sh ys sync status > "$YS_RUN_DIR/sync-status" && ! grep -q
        "Waiting to go up" "$YS_RUN_DIR/sync-status" && ! grep -q "Last problem"
        "$YS_RUN_DIR/sync-status"
    # The loop tries again as after a failed pass, at most five minutes apart.
    timeout: 8m
  - id: a_plan_with_no_room_for_another_device
    action: shell
    # And a minute for the server's last yes to lapse.
    line: >-
      printf '%s' '{"device": {"allowed": false, "message": "Your plan has two devices."}}' >
      "$YS_RUN_DIR/plans.json" && sleep 65
    timeout: 2m
  - id: a_new_phone_is_not_signed_in
    action: run
    program: bun
    args: [.yardsort/tests/support/phone.ts, "{{ run.dir }}", not-signed-in]
    expect:
      stdout_contains: "told: Your plan has two devices."
  - id: the_paired_phone_still_connects
    action: run
    program: bun
    args: [.yardsort/tests/support/phone.ts, "{{ run.dir }}", reaches, Smoke box]
    expect:
      stdout_contains: welcomed by
  - id: every_question_carried_the_token_and_named_nobody
    action: shell
    line: >-
      test -s "$YS_RUN_DIR/plans-asked.jsonl" && ! grep -q '"tokened":false' "$YS_RUN_DIR/plans-asked.jsonl"
      && ! grep -qi -e someone -e "smoke" "$YS_RUN_DIR/plans-asked.jsonl" && grep -c . "$YS_RUN_DIR/plans-asked.jsonl"
      && grep -o '"action":"[a-z]*"' "$YS_RUN_DIR/plans-asked.jsonl" | sort | uniq -c
    expect:
      stdout_contains: '"action":"sync"'

teardown:
  - id: stop_serving
    action: shell
    line: >-
      kill "$(cat "$YS_RUN_DIR/serve.pid" 2>/dev/null)" 2>/dev/null; pkill -HUP -f "yardsort-daemon
      .*$YS_RUN_DIR/profile"; pkill -f "yardsort-daemon .*$YS_RUN_DIR/profile"; true
