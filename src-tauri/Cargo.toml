[package]
name = "yardsort"
description = "Run AI coding agents in parallel, each on its own track"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which matters on Windows:
# https://github.com/rust-lang/cargo/issues/8519
name = "yardsort_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
pty-host = { path = "../crates/pty-host", features = ["specta"] }
pty-ipc = { path = "../crates/pty-ipc" }
which = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
dunce = "1"
toml = "1"
notify = "8"
ignore = "0.4"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
# Assist talks to TypeSafe over the TLS stack the updater already brings.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Backoff between retries, and a few files reviewed at once.
tokio = { version = "1", features = ["time", "rt"] }
# The Assist API key lives in the OS credential store, never in settings.toml.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# `setsid` and `flock`, for putting the daemon out of reach of signals meant for the app.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
